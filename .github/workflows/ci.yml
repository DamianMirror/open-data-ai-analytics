name: CI (modules)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      module:
        description: "Which module to run (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - data_load
          - data_quality_analysis
          - analysis_and_models
          - data_visualization

jobs:
  run-modules:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: [data_load, data_quality_analysis, analysis_and_models, data_visualization]

    steps:
      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download data (required for notebooks)
        if: ${{ matrix.module != 'data_load' && (github.event_name != 'workflow_dispatch' || github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module) }}
        run: |
          echo "Downloading data for notebooks..."
          python -m src.data_load

      - name: Run module - data_load
        if: ${{ matrix.module == 'data_load' && (github.event_name != 'workflow_dispatch' || github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module) }}
        run: |
          mkdir -p artifacts/${{ matrix.module }}
          echo "Running ${{ matrix.module }}"
          python -m src.data_load > artifacts/${{ matrix.module }}/run.log 2>&1
          echo "Module ${{ matrix.module }} completed successfully" >> artifacts/${{ matrix.module }}/status.txt

      - name: Run module - data_quality_analysis
        if: ${{ matrix.module == 'data_quality_analysis' && (github.event_name != 'workflow_dispatch' || github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module) }}
        run: |
          mkdir -p artifacts/${{ matrix.module }}
          echo "Running ${{ matrix.module }} notebook"
          # Конвертація ноутбука в HTML для перегляду результатів
          set +e
          jupyter nbconvert --to html --execute notebooks/data_quality_analysis.ipynb --output-dir=artifacts/${{ matrix.module }} > artifacts/${{ matrix.module }}/run.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Notebook execution failed with exit code $EXIT_CODE"
            echo "Last 50 lines of log:"
            tail -50 artifacts/${{ matrix.module }}/run.log
            exit $EXIT_CODE
          fi
          echo "Notebook ${{ matrix.module }} executed successfully" >> artifacts/${{ matrix.module }}/status.txt

      - name: Run module - analysis_and_models
        if: ${{ matrix.module == 'analysis_and_models' && (github.event_name != 'workflow_dispatch' || github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module) }}
        run: |
          mkdir -p artifacts/${{ matrix.module }}
          echo "Running ${{ matrix.module }} notebook"
          # Конвертація ноутбука в HTML
          set +e
          jupyter nbconvert --to html --execute notebooks/analysis_and_models.ipynb --output-dir=artifacts/${{ matrix.module }} > artifacts/${{ matrix.module }}/run.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Notebook execution failed with exit code $EXIT_CODE"
            echo "Last 50 lines of log:"
            tail -50 artifacts/${{ matrix.module }}/run.log
            exit $EXIT_CODE
          fi
          echo "Notebook ${{ matrix.module }} executed successfully" >> artifacts/${{ matrix.module }}/status.txt

      - name: Run module - data_visualization
        if: ${{ matrix.module == 'data_visualization' && (github.event_name != 'workflow_dispatch' || github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module) }}
        run: |
          mkdir -p artifacts/${{ matrix.module }}
          echo "Running ${{ matrix.module }} notebook"
          # Конвертація ноутбука в HTML
          set +e
          jupyter nbconvert --to html --execute notebooks/data_visualization.ipynb --output-dir=artifacts/${{ matrix.module }} > artifacts/${{ matrix.module }}/run.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Notebook execution failed with exit code $EXIT_CODE"
            echo "Last 50 lines of log:"
            tail -50 artifacts/${{ matrix.module }}/run.log
            exit $EXIT_CODE
          fi
          # Копіювання згенерованих графіків якщо є
          if [ -d "reports/figures" ]; then
            cp -r reports/figures artifacts/${{ matrix.module }}/
          fi
          echo "Notebook ${{ matrix.module }} executed successfully" >> artifacts/${{ matrix.module }}/status.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module) }}
        with:
          name: artifacts-${{ matrix.module }}
          path: artifacts/${{ matrix.module }}
          retention-days: 30

  # CD Job - публікація результатів у GitHub Pages
  publish-results:
    needs: run-modules
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts-download

      - name: Prepare Pages content
        run: |
          mkdir -p public
          echo "<h1>Open Data AI Analytics - CI/CD Results</h1>" > public/index.html
          echo "<p>Build date: $(date)</p>" >> public/index.html
          echo "<ul>" >> public/index.html

          # Додати посилання на артефакти
          for dir in artifacts-download/artifacts-*; do
            module=$(basename $dir | sed 's/artifacts-//')
            echo "<li><a href='$module/'>$module</a></li>" >> public/index.html
            mkdir -p public/$module
            cp -r $dir/* public/$module/ 2>/dev/null || true

            # Створити index.html для кожного модуля
            echo "<!DOCTYPE html><html><head><title>$module - Results</title>" > public/$module/index.html
            echo "<style>body{font-family:Arial,sans-serif;max-width:800px;margin:50px auto;padding:20px}" >> public/$module/index.html
            echo "h1{color:#333}ul{list-style-type:none;padding:0}li{margin:10px 0}" >> public/$module/index.html
            echo "a{color:#0366d6;text-decoration:none;font-size:18px}a:hover{text-decoration:underline}" >> public/$module/index.html
            echo ".back{margin-top:30px}</style></head><body>" >> public/$module/index.html
            echo "<h1>Module: $module</h1><h2>Available Files:</h2><ul>" >> public/$module/index.html

            # Додати посилання на HTML файли якщо є
            if [ -f "public/$module/${module}.html" ]; then
              echo "<li><a href='${module}.html'>Notebook HTML Report</a></li>" >> public/$module/index.html
            fi
            if [ -f "public/$module/run.log" ]; then
              echo "<li><a href='run.log'>Execution Log</a></li>" >> public/$module/index.html
            fi
            if [ -f "public/$module/status.txt" ]; then
              echo "<li><a href='status.txt'>Status</a></li>" >> public/$module/index.html
            fi
            if [ -d "public/$module/figures" ]; then
              echo "<li><a href='figures/'>Generated Figures</a></li>" >> public/$module/index.html
            fi

            echo "</ul><div class='back'><a href='../'>← Back to main page</a></div></body></html>" >> public/$module/index.html
          done

          echo "</ul>" >> public/index.html

          # Копіювати звіти якщо є
          if [ -d "reports/figures" ]; then
            cp -r reports/figures public/
          fi

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
